# Configuration pour les tests

# Base de données en mémoire pour les tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

# Désactivation du vector store pour les tests unitaires
spring.ai.vectorstore.pgvector.initialize-schema=false

# Ollama mock configuration (pour tests sans Ollama)
spring.ai.ollama.base-url=http://mock-ollama:11434
langchain4j.ollama.chat-model.base-url=http://mock-ollama:11434
langchain4j.ollama.embedding-model.base-url=http://mock-ollama:11434

# Configuration sécurité pour tests
spring.security.user.name=testuser
spring.security.user.password=testpass
spring.security.user.roles=ADMIN

# Logging pour tests
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.web=DEBUG
logging.pattern.console=[TEST] %d{HH:mm:ss} %-5level %logger{36} - %msg%n

# Désactiver les health checks externes pour les tests
management.health.defaults.enabled=false
management.endpoints.web.exposure.include=health,info
